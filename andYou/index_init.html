            background-color: #262626;
        }
        .swiper-container {
            width: 100%;
            position: absolute;
            top: 50%;
            margin-top: -335px;
        }
        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 450px;
            height: 670px;
            border-radius: 10px;
        }
        .shadow {
            position: absolute;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            height: 100%;
            text-align: center;
            line-height: 670px;
            color: #ffffff;
            font-size: 30px;
            display: none;
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .swiper-container {
                top: 50%;
                margin-top: -40vh;
                height: 80vh;
            }
            .swiper-slide {
                width: 80%;
                height: 60vh;
            }
            .shadow {
                font-size: 20px;
                line-height: 1.5;
            }
        }
        @media (max-width: 480px) {
            .swiper-container {
                margin-top: -30vh;
            }
            .swiper-slide {
                width: 90%;
                height: 50vh;
            }
            .shadow {

        }
    </style>

    <script>
        var swiper = new Swiper('.swiper-container', {
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            loop: true,
            coverflowEffect: {
                rotate: window.innerWidth <= 768 ? 10 : 50,
                stretch: 0,
                depth: window.innerWidth <= 768 ? 30 : 100,
                modifier: 1,
                slideShadows: true,
